<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" role="img" aria-label="Sampul buku Pemrograman Web Modern">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset="1" stop-color="#0E6352"/>
    </linearGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe4cb"/>
      <stop offset="1" stop-color="#fdf8ec"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrimT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrimB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

  <!-- blok halaman (menyembul di sisi kanan) -->
  <rect x="66" y="24" width="202" height="364" rx="8" fill="url(#pg)"/>
  <g stroke="#d8c7a3" stroke-width="1.2" opacity="0.75">
    <line x1="260" y1="44" x2="260" y2="368"/>
    <line x1="263" y1="44" x2="263" y2="368"/>
    <line x1="266" y1="44" x2="266" y2="368"/>
  </g>

  <!-- sampul depan -->
  <rect x="50" y="30" width="210" height="354" rx="9" fill="url(#g)"/>
  <rect x="50" y="30" width="210" height="354" rx="9" fill="url(#gloss)"/>
  <rect x="50" y="30" width="210" height="90" rx="9" fill="url(#scrimT)"/>
  <rect x="50" y="294" width="210" height="90" rx="9" fill="url(#scrimB)"/>

  <!-- punggung buku -->
  <rect x="36" y="36" width="15" height="342" rx="5" fill="url(#sp)"/>
  <rect x="50" y="36" width="3" height="342" fill="#ffffff" opacity="0.20"/>
  <rect x="36" y="66" width="15" height="4" rx="2" fill="#ffc93c" opacity="0.85"/>
  <rect x="36" y="344" width="15" height="4" rx="2" fill="#ffc93c" opacity="0.85"/>

  <!-- bingkai tipis -->
  <rect x="62" y="44" width="186" height="326" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>

  <!-- ornamen motif samar -->
  <g opacity="0.14" transform="translate(178,258)"><rect x="-38" y="-38" width="76" height="76" rx="10" fill="none" stroke="#ffffff" stroke-width="5"/><rect x="-16" y="-16" width="32" height="32" rx="4" fill="#ffffff"/><line x1="-24" y1="-38" x2="-24" y2="-49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="-24" y1="38" x2="-24" y2="49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="-38" y1="-24" x2="-49" y2="-24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="38" y1="-24" x2="49" y2="-24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="-38" x2="0" y2="-49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="38" x2="0" y2="49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="-38" y1="0" x2="-49" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="38" y1="0" x2="49" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="24" y1="-38" x2="24" y2="-49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="24" y1="38" x2="24" y2="49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="-38" y1="24" x2="-49" y2="24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/><line x1="38" y1="24" x2="49" y2="24" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g>

  <!-- teks sampul -->
  <text x="72" y="80" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.4" fill="#ffffff" opacity="0.9">TEKNOLOGI</text>
  <text x="72" y="146" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Pemrograman Web</text>
  <text x="72" y="176" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Modern</text>
  <rect x="72" y="196" width="46" height="5" rx="2.5" fill="#ffc93c"/>
  <text x="72" y="358" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="14" font-style="italic" fill="#ffffff" opacity="0.88">Erik Thornstrand</text>
</svg>
